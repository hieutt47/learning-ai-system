server:
  port: 8080
spring:
  application:
    name: learningai
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
jwt:
  jwt-signing-key: ${JWT_SIGNING_KEY}
  access-ttl: 900000 # ms - 15 mins
  refresh-ttl: 604800000 # ms - 7 days

app:
  auth:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Lax

