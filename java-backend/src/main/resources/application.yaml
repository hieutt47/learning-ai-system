server:
  port: 8080
spring:
  application:
    name: learningai
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# M4 — sinh nội dung bằng AI (contracts/ai-output.md)
app:
  ai:
    provider: ${AI_PROVIDER:mock}          # mock | llm (định dạng OpenAI Chat Completions: OpenRouter, OpenAI, Anthropic...)
    base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:8192}
    max-source-chars: 20000
