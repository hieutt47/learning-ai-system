<title>Learning AI System</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — sidebar theo vai trò + header + nội dung; token lấy từ Design System gốc */
:root{--bg:#F5F6FA;--surface:#FFFFFF;--surface-2:#F9FAFB;--border:#E5E7EB;--border-strong:#D1D5DB;--text:#111827;--text-2:#4B5563;--text-3:#6B7280;--primary:#4F46E5;--primary-hover:#4338CA;--primary-soft:#EEF2FF;--primary-text:#4338CA;--primary-line:#C7D2FE;--on-primary:#FFFFFF;--success:#16A34A;--success-soft:#DCFCE7;--success-text:#15803D;--warning:#D97706;--warning-soft:#FEF3C7;--warning-text:#B45309;--danger:#DC2626;--danger-soft:#FEE2E2;--danger-text:#B91C1C;--danger-line:#FECACA;--info:#0891B2;--neutral-soft:#F3F4F6;--neutral-text:#374151;--skeleton:#E5E7EB;--overlay:rgba(17,24,39,.5);--ring:0 0 0 3px rgba(79,70,229,.35);--ring-danger:0 0 0 3px rgba(220,38,38,.28);--shadow-card:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-pop:0 16px 32px -8px rgba(16,24,40,.18),0 4px 8px -4px rgba(16,24,40,.08);--hero:#4338CA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--surface:#111827;--surface-2:#162033;--border:#1F2937;--border-strong:#374151;--text:#F3F4F6;--text-2:#9CA3AF;--text-3:#8B95A7;--primary:#818CF8;--primary-hover:#A5B4FC;--primary-soft:rgba(129,140,248,.14);--primary-text:#A5B4FC;--primary-line:rgba(129,140,248,.35);--on-primary:#0B1120;--success:#4ADE80;--success-soft:rgba(74,222,128,.12);--success-text:#4ADE80;--warning:#FBBF24;--warning-soft:rgba(251,191,36,.12);--warning-text:#FBBF24;--danger:#F87171;--danger-soft:rgba(248,113,113,.12);--danger-text:#F87171;--danger-line:rgba(248,113,113,.32);--info:#22D3EE;--neutral-soft:#1F2937;--neutral-text:#D1D5DB;--skeleton:#1F2937;--overlay:rgba(0,0,0,.65);--ring:0 0 0 3px rgba(129,140,248,.45);--ring-danger:0 0 0 3px rgba(248,113,113,.4);--shadow-card:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 16px 40px -8px rgba(0,0,0,.6);--hero:#3730A3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1120;--surface:#111827;--surface-2:#162033;--border:#1F2937;--border-strong:#374151;--text:#F3F4F6;--text-2:#9CA3AF;--text-3:#8B95A7;--primary:#818CF8;--primary-hover:#A5B4FC;--primary-soft:rgba(129,140,248,.14);--primary-text:#A5B4FC;--primary-line:rgba(129,140,248,.35);--on-primary:#0B1120;--success:#4ADE80;--success-soft:rgba(74,222,128,.12);--success-text:#4ADE80;--warning:#FBBF24;--warning-soft:rgba(251,191,36,.12);--warning-text:#FBBF24;--danger:#F87171;--danger-soft:rgba(248,113,113,.12);--danger-text:#F87171;--danger-line:rgba(248,113,113,.32);--info:#22D3EE;--neutral-soft:#1F2937;--neutral-text:#D1D5DB;--skeleton:#1F2937;--overlay:rgba(0,0,0,.65);--ring:0 0 0 3px rgba(129,140,248,.45);--ring-danger:0 0 0 3px rgba(248,113,113,.4);--shadow-card:0 1px 2px rgba(0,0,0,.35);--shadow-pop:0 16px 40px -8px rgba(0,0,0,.6);--hero:#3730A3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--primary-text)}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st{font-size:12px;line-height:1.5;color:var(--text-2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card)}
.avatar{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}.avatar.lg{width:40px;height:40px;font-size:14px}.avatar.xl{width:56px;height:56px;font-size:18px}
.tone-primary{background:var(--primary-soft);color:var(--primary-text)}.tone-success{background:var(--success-soft);color:var(--success-text)}.tone-warning{background:var(--warning-soft);color:var(--warning-text)}.tone-danger{background:var(--danger-soft);color:var(--danger-text)}.tone-neutral{background:var(--neutral-soft);color:var(--neutral-text)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap}
.badge .ic{width:12px;height:12px;stroke-width:2.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.pgb:focus-visible,.nav-i:focus-visible,.tab:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:var(--primary);color:var(--on-primary)}.btn-primary:hover{background:var(--primary-hover);color:var(--on-primary)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}.btn-secondary:hover{background:var(--neutral-soft);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{filter:brightness(.92);color:#fff}
.btn-ghost{background:transparent;color:var(--primary-text)}.btn-ghost:hover{background:var(--primary-soft)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.iconbtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--text-2);cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--neutral-soft);color:var(--text)}.iconbtn[disabled]{opacity:.4;cursor:not-allowed}
.iconbtn.danger:hover{background:var(--danger-soft);color:var(--danger-text)}
.shell{min-height:100vh;display:flex;flex-wrap:wrap}
.sb{flex:0 0 248px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 8px;text-decoration:none}
.logo-mk{width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.logo b{font-size:16px;font-weight:700;color:var(--text);flex:1}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);padding:0 12px 6px}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:var(--text-2);font-size:14px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.nav-i:hover{background:var(--neutral-soft);color:var(--text)}
.nav-i.on{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.nav-i .badge{margin-left:auto;height:20px;padding:0 7px}
.ubox{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2)}
.ubox b{display:block;font-size:14px;font-weight:600}.ubox span.st{display:block}
.gbox{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2)}
.gbox p{margin:0 0 4px;font-size:12px;color:var(--text-2)}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.hdr{min-height:72px;display:flex;align-items:center;gap:16px;padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.hdr h1{margin:0;font-size:20px;line-height:1.4;font-weight:600}
.hdr.flat{border-bottom:0;position:static}
.hdr .grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);width:320px;max-width:100%}
.search input{border:0;background:transparent;outline:0;flex:1;font-size:14px;min-width:0}
.search input::placeholder{color:var(--text-3)}
.search:focus-within{border-color:var(--primary);box-shadow:var(--ring);background:var(--surface)}
.ava-btn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:60;display:flex;flex-direction:column}
.menu a,.menu button{white-space:nowrap;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0;background:transparent;text-align:left;font-size:14px;color:var(--text);cursor:pointer;text-decoration:none;width:100%}
.menu a:hover,.menu button:hover{background:var(--neutral-soft)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0;width:100%}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin:0;padding:0;list-style:none;flex-wrap:wrap}
.crumb a{color:var(--text-2);text-decoration:none}.crumb a:hover{color:var(--primary-text);text-decoration:underline}
.crumb [aria-current]{color:var(--text);font-weight:500}
.tabs{display:flex;gap:24px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:12px 0;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:500;color:var(--text-2);display:inline-flex;gap:8px;align-items:center;text-decoration:none;cursor:pointer}
.tab:hover{color:var(--text);border-bottom-color:var(--border-strong)}
.tab.on{color:var(--primary-text);border-bottom-color:var(--primary);font-weight:600}
.tab .badge{height:20px;padding:0 7px}
.content{padding:32px;display:flex;flex-direction:column;gap:24px;width:100%;max-width:1240px}.content>*{min-width:0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:16px}
h2.sec-t{margin:0;font-size:18px;font-weight:600}
.two{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.two>.l{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:24px}
.two>.r{flex:1 1 300px;max-width:360px;display:flex;flex-direction:column;gap:16px;position:sticky;top:96px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:500;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--text-3);color:var(--text)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.chip .n{font-size:12px;font-weight:600;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.cc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--text);transition:box-shadow .15s,transform .15s,border-color .15s}
.cc:hover{box-shadow:var(--shadow-pop);transform:translateY(-2px);border-color:var(--border-strong)}
.cv{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;max-width:100%}
.cv svg{width:62%;height:auto}
.corner{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);color:var(--success-text);box-shadow:var(--shadow-card);border:1px solid var(--border)}
.corner.warn{color:var(--warning-text)}
.cc-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cc-cat{font-size:12px;font-weight:600;color:var(--primary-text);letter-spacing:.04em;text-transform:uppercase}
.cc-title{margin:0;font-size:16px;line-height:1.5;font-weight:600;min-height:48px}
.cc:hover .cc-title{color:var(--primary-text)}
.cc-who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.cc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;margin-top:auto;border-top:1px solid var(--border);font-size:12px;color:var(--text-2)}
.cc-foot span{display:inline-flex;align-items:center;gap:6px}
.pg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pgb{min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--text-2);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pgb:hover{background:var(--neutral-soft);color:var(--text)}.pgb.on{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.pgb:disabled{color:var(--text-3);cursor:not-allowed;opacity:.7;background:transparent}
.tbox{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{height:44px;padding:0 20px;text-align:left;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-bottom:1px solid var(--border);border-top:1px solid var(--border);white-space:nowrap}
.tbl td{height:60px;padding:8px 20px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--surface-2)}.tbl tr.click{cursor:pointer}.tbl tr.sel td{background:var(--primary-soft)}
.tbl td b{font-weight:600;color:var(--text)}
.tbl .nw{white-space:nowrap}
.who{display:flex;align-items:center;gap:12px}.who small{display:block;font-size:12px;color:var(--text-2)}
.sortbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--text);cursor:pointer}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.thead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:14px;font-weight:500}.flabel i{font-style:normal;color:var(--danger-text)}
.help{font-size:12px;color:var(--text-2);margin:0}.err{font-size:12px;color:var(--danger-text);margin:0;display:flex;gap:6px;align-items:center}
.input,.select,.textarea{display:block;width:100%;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:14px;line-height:1.5;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{padding:10px 12px;resize:vertical;min-height:96px}
.input:hover,.select:hover,.textarea:hover{border-color:var(--text-3)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
.input.bad,.textarea.bad{border-color:var(--danger);box-shadow:none}.input.bad:focus,.textarea.bad:focus{box-shadow:var(--ring-danger)}
.input[disabled]{background:var(--neutral-soft);color:var(--text-2)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.ifield{position:relative}.ifield .lead{position:absolute;left:12px;top:12px;color:var(--text-2);display:flex;pointer-events:none}.ifield .input{padding-left:40px}.ifield .input.trail{padding-right:44px}
.eye{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.eye:hover{background:var(--neutral-soft)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{height:38px;padding:0 16px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--text-2);cursor:pointer;border-right:1px solid var(--border-strong)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{width:38px;height:38px;border:0;background:var(--surface-2);cursor:pointer;font-size:18px;color:var(--text)}
.stepper input{width:56px;height:38px;border:0;text-align:center;background:var(--surface);font-size:14px;outline:none}
.check{width:18px;height:18px;accent-color:var(--primary)}
.sec{padding:24px;display:flex;flex-direction:column;gap:16px}
.sec h2{margin:0;font-size:18px;font-weight:600}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.facts li{display:flex;align-items:center;gap:10px}.facts .ic{color:var(--text-2)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checklist .ck{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none;margin-top:1px}
.ck.ok{background:var(--success-soft);color:var(--success-text)}.ck.no{background:var(--neutral-soft);color:var(--text-3)}
.progress{height:8px;border-radius:999px;background:var(--neutral-soft);overflow:hidden}.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.stat{padding:20px;display:flex;flex-direction:column;gap:4px}.stat b{font-size:28px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--text-2)}.stat small{font-size:12px;color:var(--text-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid;font-size:14px}
.notice.info{background:var(--primary-soft);border-color:var(--primary-line);color:var(--primary-text)}
.notice.warn{background:var(--warning-soft);border-color:var(--warning);color:var(--warning-text)}
.notice.bad{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger-text)}
.notice.good{background:var(--success-soft);border-color:var(--success);color:var(--success-text)}
.notice b{display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 24px}
.empty .eic{width:64px;height:64px;border-radius:999px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center}
.empty .eic .ic{width:28px;height:28px}.empty h2{margin:0;font-size:18px}.empty p{margin:0;color:var(--text-2);max-width:420px}
.skel{background:var(--skeleton);border-radius:8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.modal h2{margin:0;font-size:18px}.modal p{margin:0;color:var(--text-2)}
.modal .mic{width:44px;height:44px;border-radius:999px;display:grid;place-items:center}
.modal .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:200;width:min(440px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--text);color:var(--bg);box-shadow:var(--shadow-pop);font-size:14px}
.toast small{display:block;opacity:.75;font-size:12px}.toast .tx{flex:1}

function shell({title,crumbs,search,actions='',tabs='',body,flat}){const u=me();
 const cr=crumbs?`<ol class="crumb" aria-label="Breadcrumb">${crumbs.map((c,i)=>i===crumbs.length-1?`<li><span aria-current="page">${esc(c[0])}</span></li>`:`<li><a href="${c[1]}">${esc(c[0])}</a></li><li aria-hidden="true">/</li>`).join('')}</ol>`:'';

 return `<div class="shell">${nav()}<div class="main"><header class="hdr ${flat?'flat':''}"><div class="grow">${cr}${crumbs?`<span style="font-size:20px;line-height:1.4;font-weight:600">${esc(title)}</span>`:`<h1>${esc(title)}</h1>`}</div>${sb}${actions}${acct}</header>${tabs}<main class="content">${body}</main></div></div>`}
const tabsBar=(items)=>`<nav class="tabs" aria-label="Phần của trang">${items.map(([h,t,on,n])=>`<a class="tab ${on?'on':''}" href="${h}" ${on?'aria-current="page"':''}>${t}${n!==undefined?`<span class="badge tone-neutral">${n}</span>`:''}</a>`).join('')}</nav>`;

function resolve(){const p=location.hash.slice(1).split('-').filter(Boolean);let name=p[0]||HOME(me());R.name=name;R.a=p.slice(1);
 const acc=ACCESS[name];if(!acc||!VIEWS[name]){R.name='nf';return VIEWS.nf()}
 const u=me();
 if(acc==='guest'&&u){setTimeout(()=>go(HOME(u)));return ''}
 if(acc!=='*'&&acc!=='guest'&&!u){V.next=location.hash.slice(1);setTimeout(()=>go('login'));R.name='login';return VIEWS.login()}
 if(acc!=='*'&&acc!=='guest'&&acc!=='auth'&&u.role!==acc){R.name='forbidden';return VIEWS.forbidden(acc)}
 return VIEWS[name](...R.a)}
let lastRoute='';

function render(){if(rendering)return;rendering=true;try{renderNow()}finally{rendering=false}}
function renderNow(){const a=document.activeElement;const id=a&&a.id;const ss=a&&a.selectionStart,se=a&&a.selectionEnd;
 const sy=window.scrollY;const html=resolve();$('#app').innerHTML=html;
 const m=S.modal;$('#modal').innerHTML=m?MODALS[m.type](m):'';
 if(id){const n=document.getElementById(id);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}
 else if(m){const f=$('#modal [autofocus],#modal input,#modal textarea,#modal button');f&&f.focus()}
 if(lastRoute===location.hash)window.scrollTo(0,sy);lastRoute=location.hash;
 document.title='Learning AI System';
 $('#dock').innerHTML=dock()}

 if(S.dock&&!e.target.closest('.dock')){S.dock=false;render()}
 if(e.target.classList&&e.target.classList.contains('modal-bg')&&S.modal&&!S.modal.sticky){closeModal();return}
 if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='A'||el.type==='submit')e.preventDefault();f(el.dataset.arg,el,e)}});
let liveT=null,composing=false;
document.addEventListener('compositionstart',()=>{composing=true});
document.addEventListener('compositionend',e=>{composing=false;const el=e.target;if(el.dataset&&el.dataset.bind){V.f[el.dataset.bind]=el.value;if(el.dataset.live)render()}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;V.f[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value;
 const c=el.closest('.field')?.querySelector('[data-count]');if(c)c.textContent=`${el.value.length} / ${c.dataset.count}`;
 if(el.dataset.live&&!composing&&!e.isComposing){if(el.type==='text'||el.type==='search'||el.tagName==='TEXTAREA'){clearTimeout(liveT);liveT=setTimeout(render,120)}else render()}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;V.f[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.live)render()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-submit]');if(f){e.preventDefault();A[f.dataset.submit](f.dataset.arg,f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal&&!S.modal.sticky)closeModal();else if(S.menu){S.menu=false;render()}}
 if(R.name==='quiz'&&!S.modal&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||R.name==='quiz'&&!S.modal&&e.target.type==='radio'){const q=by(DB.quizzes,R.a[0]);const m=e.key.match(/^[1-6]$/);if(q&&m&&+e.key<=q.qs[Math.min(V.qi??0,q.qs.length-1)].o.length){e.preventDefault();A.ans(+e.key-1)}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();const n=q.qs.length,i=V.qi??0;if(i<n-1)A.qgo(i+1)}}
 if(R.name==='learn'&&R.a[2]==='flash'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')A.fnext();else if(e.key==='ArrowLeft')A.fprev();else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();A.fflip()}}});
A.menu=()=>{S.menu=!S.menu;render()};
A.theme=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=dark?'light':'dark';S.menu=false;render()};
A.logout=()=>{S.user=null;S.menu=false;toast('Đã đăng xuất');go('explore')};
A.toastact=id=>{const t=S.toasts.find(x=>x.id===id);S.toasts=S.toasts.filter(x=>x.id!==id);renderToasts();t&&t.fn&&t.fn()};

 if(!Object.keys(e).length){const u=DB.users.find(x=>x.email.toLowerCase()===em.toLowerCase());

 const body=`<p style="margin:0;color:var(--text-2);max-width:760px">Danh mục giúp sinh viên lọc khóa học ở trang Khám phá. Giảng viên chọn danh mục khi tạo khóa học.</p><section class="card"><div class="thead"><h2 class="sec-t">Tất cả danh mục <span class="st">${DB.cats.length}</span></h2><div class="row"><label class="search" style="background:var(--surface);border-color:var(--border-strong)">${ic('search')}<input id="kq" data-bind="kq" data-live="1" value="${esc(fv('kq'))}" placeholder="Tìm danh mục" aria-label="Tìm danh mục"></label><button class="btn btn-primary" data-act="catadd">${ic('plus')}Thêm danh mục</button></div></div>
 ${list.length?`<div class="tbox"><table class="tbl"><thead><tr><th>Tên danh mục</th><th>Mô tả</th><th>Số khóa học đang dùng</th><th>Hành động</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td style="min-width:240px">${c.desc?esc(c.desc):'<span class="st">Chưa có mô tả</span>'}</td><td>${c.use}</td><td class="nw"><button class="iconbtn" data-act="catedit" data-arg="${c.id}" aria-label="Sửa ${esc(c.name)}">${ic('edit')}</button><button class="iconbtn danger" data-act="catdel" data-arg="${c.id}" aria-label="Xóa ${esc(c.name)}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div><p class="st" style="padding:12px 20px;margin:0">Chỉ xóa được danh mục không có khóa học nào đang dùng.</p>`:empty('tag','Không tìm thấy danh mục','Thử từ khóa khác hoặc thêm danh mục mới.')}</section>`;
 return shell({title:'Danh mục',body})};
A.catadd=()=>{V.f.kn='';V.f.kd='';openModal({type:'cat'})};A.catedit=id=>{const c=by(DB.cats,id);V.f.kn=c.name;V.f.kd=c.desc;openModal({type:'cat',id})};
MODALS.cat=m=>`<div class="modal-bg"><form class="modal" data-submit="catsave" data-arg="${m.id||''}" novalidate role="dialog" aria-modal="true"><h2>${m.id?'Sửa danh mục':'Thêm danh mục'}</h2>${field('Tên danh mục',`<input id="kn" class="input ${m.err?'bad':''}" data-bind="kn" value="${esc(fv('kn'))}" maxlength="60" autofocus>`,{req:1,err:m.err,id:'kn'})}${field('Mô tả',`<textarea id="kd" class="textarea" data-bind="kd" style="min-height:72px">${esc(fv('kd'))}</textarea>`,{id:'kd',help:'Không bắt buộc.'})}<div class="acts"><button type="button" class="btn btn-secondary" data-act="close">Hủy</button><button class="btn btn-primary" type="submit">${m.id?'Lưu':'Thêm danh mục'}</button></div></form></div>`;
A.catsave=id=>{const n=(fv('kn')||'').trim(),d=(fv('kd')||'').trim();if(!n){S.modal.err='Nhập tên danh mục.';render();return}if(DB.cats.some(c=>c.id!==id&&c.name.toLowerCase()===n.toLowerCase())){S.modal.err='Danh mục này đã tồn tại.';render();return}
 if(id){const c=by(DB.cats,id);DB.courses.forEach(x=>{if(x.cat===c.name)x.cat=n});c.name=n;c.desc=d}else DB.cats.push({id:nid('k'),name:n,desc:d,use:0});S.modal=null;toast(id?'Đã lưu danh mục':'Đã thêm danh mục');render()};
A.catdel=id=>{const c=by(DB.cats,id);if(c.use>0)openModal({type:'catblock',id});else openModal({type:'confirm',danger:1,title:'Xóa danh mục?',body:`Danh mục “${esc(c.name)}” sẽ bị xóa.`,ok:'Xóa danh mục',act:'catdel2',arg:id})};
MODALS.catblock=m=>{const c=by(DB.cats,m.id);return `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true"><span class="mic tone-warning">${ic('alert',22)}</span><h2>Không thể xóa danh mục</h2><p>“${esc(c.name)}” đang được ${c.use} khóa học sử dụng. Hãy chuyển các khóa học sang danh mục khác trước khi xóa.</p><div class="acts"><button class="btn btn-primary" data-act="close" autofocus>Đã hiểu</button></div></div></div>`};
A.catdel2=id=>{DB.cats=DB.cats.filter(c=>c.id!==id);S.modal=null;toast('Đã xóa danh mục');render()};
VIEWS.admcourses=()=>{const q=(fv('aq')||'').toLowerCase(),list=DB.courses.filter(c=>!q||c.title.toLowerCase().includes(q)||uname(c.t).toLowerCase().includes(q));
 const body=`<section class="card"><div class="thead"><h2 class="sec-t">Tất cả khóa học <span class="st">${DB.courses.length}</span></h2><label class="search" style="background:var(--surface);border-color:var(--border-strong)">${ic('search')}<input id="aq" data-bind="aq" data-live="1" value="${esc(fv('aq'))}" placeholder="Tìm theo tên khóa hoặc giảng viên" aria-label="Tìm khóa học"></label></div>${list.length?`<div class="tbox"><table class="tbl"><thead><tr><th>Khóa học</th><th>Giảng viên</th><th>Trạng thái</th><th>Học viên</th><th>Cập nhật</th><th>Hành động</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.title)}</b><div class="st">${esc(c.cat)}</div></td><td>${esc(uname(c.t))}</td><td>${stBadge(c.status)}</td><td>${nStudents(c)}</td><td class="nw">${fD(c.updated)}</td><td><a class="btn btn-secondary btn-sm" href="${href('course',c.id)}">Xem</a> ${c.status==='Published'?`<button class="btn btn-secondary btn-sm" data-act="cunpub" data-arg="${c.id}">Gỡ xuất bản</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('folder','Không có khóa học','Thử từ khóa khác.')}</section>`;
 return shell({title:'Khóa học',body})};
A.cunpub=id=>openModal({type:'confirm',danger:1,title:'Gỡ xuất bản khóa học?',body:'Khóa học sẽ không còn hiển thị ở trang Khám phá. Giảng viên có thể xuất bản lại.',ok:'Gỡ xuất bản',act:'cunpub2',arg:id});
A.cunpub2=id=>{const c=by(DB.courses,id);c.status='Draft';c.updated=new Date();S.modal=null;toast('Đã gỡ xuất bản');render()};
VIEWS.admstats=()=>{const t=DB.users.filter(u=>u.role==='teacher'&&u.status==='active').length,s=DB.users.filter(u=>u.role==='student'&&u.status==='active').length;const T=38+Math.max(0,t-5),Sx=1202+Math.max(0,s-30),tot=T+Sx;
 const body=`<span class="st">Cập nhật lúc 09:30 29/10/2026</span><div class="stats">${[[tot,'Người dùng đang hoạt động'],[T,'Giảng viên'],[DB.courses.filter(c=>c.status==='Published').length+88,'Khóa học đã xuất bản'],[5630+DB.enroll.filter(e=>!e.seed).length,'Lượt ghi danh'],[18450+DB.attempts.filter(a=>a.sub&&!a.seed).length,'Lượt nộp bài']].map(([n,l])=>`<div class="card stat"><b>${vnum(n)}</b><span>${l}</span></div>`).join('')}</div>
 <section class="card sec"><div><h2>Giảng viên / Sinh viên</h2><span class="st">Tỷ lệ trong người dùng đang hoạt động</span></div><div class="row" style="gap:32px"><div class="donut" style="background:conic-gradient(var(--primary) ${T/tot*360}deg,var(--info) 0)"><div><div><b style="font-size:20px">${vnum(tot)}</b><span class="st">đang hoạt động</span></div></div></div><div class="col" style="gap:10px"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:99px;background:var(--info)"></i>Sinh viên <b>${vnum(Sx)} · ${(Sx/tot*100).toFixed(1).replace('.',',')}%</b></span><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:99px;background:var(--primary)"></i>Giảng viên <b>${T} · ${(T/tot*100).toFixed(1).replace('.',',')}%</b></span><span class="st">Không tính tài khoản Admin.</span></div></div></section>
 <section class="card sec"><div><h2>Cách tính số liệu</h2><span class="st">Số liệu tổng tại thời điểm cập nhật, không chia theo thời gian</span></div><dl class="dl" style="grid-template-columns:200px 1fr"><dt><b>Người dùng đang hoạt động</b></dt><dd>Tài khoản Sinh viên và Giảng viên đang ở trạng thái Hoạt động (không bị khóa).</dd><dt><b>Giảng viên</b></dt><dd>Tài khoản đã được duyệt vai trò Giảng viên và đang hoạt động.</dd><dt><b>Khóa học đã xuất bản</b></dt><dd>Khóa học đang ở trạng thái Published. Không tính Draft, Closed và Archived.</dd><dt><b>Lượt ghi danh</b></dt><dd>Tổng số lần sinh viên ghi danh vào các khóa học.</dd><dt><b>Lượt nộp bài</b></dt><dd>Tổng số lượt nộp quiz đã hoàn tất trên toàn hệ thống.</dd></dl></section>`;
 return shell({title:'Thống kê hệ thống',body})};
/* ---------- Boot ---------- */
document.body.insertAdjacentHTML('beforeend','<div id="app"></div><div id="modal"></div><div id="toasts" class="toasts" aria-live="polite"></div><div id="dock"></div>');
render();
</script>

</body></html>
